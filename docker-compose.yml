services:
  # ─────────────────────────────────────────────────────────────
  # INFRASTRUCTURE GROUP
  # ─────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: cinema-zookeeper
    profiles: [ "infra", "all" ]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    networks:
      - cinema-network
    mem_limit: 256m
    cpus: 0.75

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: cinema-kafka
    profiles: [ "infra", "all" ]
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    networks:
      - cinema-network
    mem_limit: 512m
    cpus: 0.75

  cinema-db:
    image: postgres:16
    container_name: cinema-postgres
    profiles: [ "infra", "all" ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: cinema_db
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cinema_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinema-network
    mem_limit: 512m
    cpus: 0.75

  cinema-redis:
    image: redis:7-alpine
    container_name: cinema-redis
    profiles: [ "infra", "all" ]
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - cinema-network
    mem_limit: 256m
    cpus: 0.75

  cinema-mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: cinema-mailhog
    profiles: [ "infra", "all" ]
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - cinema-network
    mem_limit: 64m
    cpus: 0.25

  cinema-keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: cinema-keycloak
    profiles: [ "infra", "all" ]
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DOCKER_DB_HOST:-cinema-db}:5432/cinema_db
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      CINEMA_DB_URL: jdbc:postgresql://cinema-db:5432/cinema_db
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "8089:8080"
    volumes:
      - ./keycloak-theme:/opt/keycloak/themes
    depends_on:
      cinema-db:
        condition: service_healthy
    networks:
      - cinema-network
    mem_limit: 768m
    cpus: 0.75

  cinema-jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cinema-jaeger
    profiles: [ "infra", "all" ]
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - cinema-network
    mem_limit: 128m
    cpus: 0.25

  # ─────────────────────────────────────────────────────────────
  # GATEWAY GROUP
  # ─────────────────────────────────────────────────────────────
  cinema-gateway:
    build:
      context: ./cinema-microservices
      dockerfile: Dockerfile.runtime
      args:
        MODULE_NAME: cinema-gateway
    container_name: cinema-gateway
    profiles: [ "gateway", "all" ]
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8085
      MANAGEMENT_SERVICE_URL: http://management-service:8086
      REDIS_HOST: cinema-redis
      JAVA_OPTS: "-Xms64m -Xmx128m"
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      OTEL_JAVAAGENT_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: cinema-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_ENDPOINT:-http://cinema-jaeger:4318/v1/traces}"
      LOGGING_FILE_NAME: /app/logs/cinema-gateway.log
    volumes:
      - cinema_logs:/app/logs
    networks:
      - cinema-network
    mem_limit: 256m
    cpus: 0.75
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # APPLICATION MICROSERVICES GROUP
  # ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./cinema-microservices
      dockerfile: Dockerfile.runtime
      args:
        MODULE_NAME: auth-service
    container_name: auth-service
    profiles: [ "app", "all" ]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-cinema-db}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-cinema-redis}
      JAVA_OPTS: "-Xms128m -Xmx256m"
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      OTEL_JAVAAGENT_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_ENDPOINT:-http://cinema-jaeger:4318/v1/traces}"
      LOGGING_FILE_NAME: /app/logs/auth-service.log
    volumes:
      - cinema_logs:/app/logs
    depends_on:
      cinema-db:
        condition: service_healthy
      cinema-keycloak:
        condition: service_started
      cinema-redis:
        condition: service_started
    networks:
      - cinema-network
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  booking-service:
    build:
      context: ./cinema-microservices
      dockerfile: Dockerfile.runtime
      args:
        MODULE_NAME: booking-service
    container_name: booking-service
    profiles: [ "app", "all" ]
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-cinema-db}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-cinema-redis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_OPTS: "-Xms128m -Xmx256m"
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      OTEL_JAVAAGENT_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: booking-service
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_ENDPOINT:-http://cinema-jaeger:4318/v1/traces}"
      LOGGING_FILE_NAME: /app/logs/booking-service.log
    volumes:
      - cinema_logs:/app/logs
    depends_on:
      cinema-db:
        condition: service_healthy
    networks:
      - cinema-network
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  management-service:
    build:
      context: ./cinema-microservices
      dockerfile: Dockerfile.runtime
      args:
        MODULE_NAME: management-service
    container_name: management-service
    profiles: [ "app", "all" ]
    restart: unless-stopped
    ports:
      - "8086:8086"
    env_file:
      - .env
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-cinema-db}
      REDIS_HOST: ${DOCKER_REDIS_HOST:-cinema-redis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_OPTS: "-Xms128m -Xmx256m"
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      OTEL_JAVAAGENT_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: management-service
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_ENDPOINT:-http://cinema-jaeger:4318/v1/traces}"
      LOGGING_FILE_NAME: /app/logs/management-service.log
    volumes:
      - cinema_logs:/app/logs
    depends_on:
      cinema-db:
        condition: service_healthy
    networks:
      - cinema-network
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cinema_data:
  cinema_logs:

networks:
  cinema-network:
    driver: bridge
