name: CI/CD Microservices

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cinema-microservices/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'cinema-microservices/**'

jobs:
  # Job 1: Phân tích xem chính xác service nào đã bị thay đổi code
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Paths Filter
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          cinema-iam: cinema-microservices/cinema-iam/**
          cinema-catalog: cinema-microservices/cinema-catalog/**
          cinema-admin: cinema-microservices/cinema-admin/**
          cinema-booking: cinema-microservices/cinema-booking/**
          cinema-notification: cinema-microservices/cinema-notification/**
          cinema-facility: cinema-microservices/cinema-facility/**
          cinema-scheduling: cinema-microservices/cinema-scheduling/**
          cinema-gateway: cinema-microservices/cinema-gateway/**

  # Job 2: Chỉ chạy build cho những service bị thay đổi
  build:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build JAR with Maven
      working-directory: cinema-microservices/${{ matrix.service }}
      run: mvn clean package -DskipTests

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./cinema-microservices
        file: ./cinema-microservices/Dockerfile.runtime
        build-args: |
          MODULE_NAME=${{ matrix.service }}
        push: ${{ github.event_name == 'push' }} # Chỉ push nếu là sự kiện Push
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
