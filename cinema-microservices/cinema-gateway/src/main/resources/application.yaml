server:
  port: 8080

spring:
  config:
    import: "optional:file:../../.env[.properties]"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  application:
    name: cinema-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI_INTERNAL}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI_INTERNAL}/protocol/openid-connect/certs
  cloud:
    gateway:
      # Thêm timeout config
      httpclient:
        connect-timeout: 2000       # 2s để connect tới downstream
        response-timeout: 15s       # 15s chờ response từ downstream
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - AddRequestHeader=X-Internal-Api-Key, ${APP_SECURITY_INTERNAL_API_KEY}


      routes:
        # Auth Service
        - id: auth-service
          uri: "${AUTH_SERVICE_URL}"
          predicates:
            - Path=/api/v1/auth/**, /api/v1/profile/**
          metadata:
            connect-timeout: 2000
            response-timeout: 15000   # per-route override (ms)
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Booking Service WS (Tách riêng để tránh lỗi RateLimiter + CircuitBreaker với streaming)
        - id: booking-service-ws
          uri: "${BOOKING_SERVICE_URL}"
          order: -2
          predicates:
            - Path=/ws/cinema/**

        # Booking Service (Luồng đặt vé, thanh toán)
        - id: booking-service
          uri: "${BOOKING_SERVICE_URL}"
          order: -1
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/vnpay/**, /api/v1/payments/**, /api/v1/showtimes/*/seats, /api/v1/camunda/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: bookingCircuitBreaker
                fallbackUri: forward:/fallback/booking

        # Management Service (Admin/Staff CRUD + Public data)
        - id: management-service
          uri: "${MANAGEMENT_SERVICE_URL}"
          predicates:
            - Path=/api/v1/admin/**, /api/v1/internal/**, /api/v1/facilities/**, /api/v1/rooms/**, /api/v1/public/**, /api/v1/movies/**, /api/v1/showtimes/**, /api/v1/featured-movies/**

        # Keycloak Proxy (Đầy đủ cho Admin Console và Auth)
        - id: keycloak-service
          uri: "${KEYCLOAK_URL}"
          predicates:
            - Path=/realms/**, /resources/**, /admin/**, /js/**, /welcome/**, /robots.txt

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ─────────────────────────────────────────────────────────────
# HttpOnly Cookie Session Configuration
# ─────────────────────────────────────────────────────────────
cinema:
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: Lax           # Lax cho phep cookie gui kem khi redirect tu VNPay (GET redirect)
    # domain: KHONG set domain de Chrome tu su dung domain hien tai (localhost)
    access-token-name: ACCESS_TOKEN
    refresh-token-name: REFRESH_TOKEN
    csrf-token-name: XSRF-TOKEN
    access-token-max-age: 1800       # 30 phut, khop voi JWT_EXPIRATION_MS=1800000
    refresh-token-max-age: 2592000   # 30 days

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 80
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 10
    instances:
      bookingCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
