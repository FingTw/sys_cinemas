server:
  port: 8080

spring:
  config:
    import: "optional:file:../../.env[.properties]"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  application:
    name: cinema-gateway
  cloud:
    gateway:
      # Thêm timeout config
      httpclient:
        connect-timeout: 2000       # 2s để connect tới downstream
        response-timeout: 15s       # 15s chờ response từ downstream
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
        - AddRequestHeader=X-Internal-Api-Key, ${APP_SECURITY_INTERNAL_API_KEY}


      routes:
        # IAM Service
        - id: iam-service
          uri: "${IAM_SERVICE_URL}"
          predicates:
            - Path=/api/v1/auth/**, /api/v1/profile/**
          metadata:
            connect-timeout: 2000
            response-timeout: 15000   # per-route override (ms)
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Catalog Service
        - id: catalog-service
          uri: "${CATALOG_SERVICE_URL}"
          predicates:
            - Path=/api/v1/movies/**, /api/v1/public/promotions, /api/v1/public/services

        # Facility Service
        - id: facility-service
          uri: "${FACILITY_SERVICE_URL}"
          predicates:
            - Path=/api/v1/facilities/**, /api/v1/rooms/**

        # Scheduling Service
        - id: booking-seat-status-service
          uri: "${BOOKING_SERVICE_URL}"
          predicates:
            - Path=/api/v1/showtimes/{showtimeId}/seats

        - id: scheduling-service
          uri: "${SCHEDULING_SERVICE_URL}"
          predicates:
            - Path=/api/v1/showtimes/**

        # Booking Service (Bảo vệ bằng Rate Limiting: 10 req/s, burst max 20 req/s)
        - id: booking-service
          uri: "${BOOKING_SERVICE_URL}"
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/vnpay/**, /api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: bookingCircuitBreaker
                fallbackUri: forward:/fallback/booking

        # Admin Service
        - id: admin-service
          uri: "${ADMIN_SERVICE_URL}"
          predicates:
            - Path=/api/v1/admin/**, /api/v1/internal/cors-config, /api/v1/internal/security-config

        # Keycloak Proxy (Đầy đủ cho Admin Console và Auth)
        - id: keycloak-service
          uri: "${KEYCLOAK_URL}"
          predicates:
            - Path=/realms/**, /resources/**, /admin/**, /js/**, /welcome/**, /robots.txt

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0

# ─────────────────────────────────────────────────────────────
# HttpOnly Cookie Session Configuration
# ─────────────────────────────────────────────────────────────
cinema:
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: Strict
    domain: ${COOKIE_DOMAIN:localhost}
    access-token-name: ACCESS_TOKEN
    refresh-token-name: REFRESH_TOKEN
    csrf-token-name: XSRF-TOKEN
    access-token-max-age: 3600       # 1 hour (should match JWT TTL)
    refresh-token-max-age: 2592000   # 30 days

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      bookingCircuitBreaker:
        baseConfig: default
