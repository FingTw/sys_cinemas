server:
  port: 8080

spring:
  application:
    name: cinema-gateway
  cloud:
    gateway:
      # Thêm timeout config
      httpclient:
        connect-timeout: 2000       # 2s để connect tới downstream
        response-timeout: 15s       # 15s chờ response từ downstream
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # IAM Service
        - id: iam-service
          uri: "${IAM_SERVICE_URL:http://localhost:8081}"
          predicates:
            - Path=/api/v1/auth/**, /api/v1/admin/users/**, /api/v1/profile/**
          metadata:
            connect-timeout: 2000
            response-timeout: 15000   # per-route override (ms)

        # ... các route khác giữ nguyên

        # Catalog Service
        - id: catalog-service
          uri: "${CATALOG_SERVICE_URL:http://localhost:8082}"
          predicates:
            - Path=/api/v1/movies/**, /api/v1/admin/movies/**

        # Facility Service
        - id: facility-service
          uri: "${FACILITY_SERVICE_URL:http://localhost:8083}"
          predicates:
            - Path=/api/v1/facilities/**, /api/v1/admin/facilities/**, /api/v1/rooms/**

        # Scheduling Service
        - id: booking-seat-status-service
          uri: "${BOOKING_SERVICE_URL:http://localhost:8085}"
          predicates:
            - Path=/api/v1/showtimes/{showtimeId}/seats

        - id: scheduling-service
          uri: "${SCHEDULING_SERVICE_URL:http://localhost:8084}"
          predicates:
            - Path=/api/v1/showtimes/**, /api/v1/admin/showtimes/**

        # Booking Service
        - id: booking-service
          uri: "${BOOKING_SERVICE_URL:http://localhost:8085}"
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/admin/bookings/**, /api/v1/vnpay/**, /api/v1/payments/**, /api/v1/admin/dashboard/**

        # Keycloak Proxy (Đầy đủ cho Admin Console và Auth)
        - id: keycloak-service
          uri: "http://cinema-keycloak:8080"
          predicates:
            - Path=/realms/**, /resources/**, /admin/**, /js/**, /welcome/**, /robots.txt

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
