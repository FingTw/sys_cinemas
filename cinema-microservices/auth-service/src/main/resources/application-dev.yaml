server:
  port: 8081
  tomcat:
    connection-timeout: 10s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100

    threads:
      max: 50
      min-spare: 5

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

spring:
  config:
    import: "optional:file:../../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/cinema_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  hikari:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
  mvc:
    async:
      request-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri: ${KEYCLOAK_ISSUER_URI_INTERNAL} # Removed to allow token generated from localhost
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI_INTERNAL}/protocol/openid-connect/certs

keycloak:
  auth-uri:    ${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/auth
  token-uri:   ${KEYCLOAK_ISSUER_URI_INTERNAL}/protocol/openid-connect/token
  jwks-uri:    ${KEYCLOAK_ISSUER_URI_INTERNAL}/protocol/openid-connect/certs
  logout-uri:  ${KEYCLOAK_ISSUER_URI_INTERNAL}/protocol/openid-connect/logout
  client-id:   ${KEYCLOAK_CLIENT_ID:cinema-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  frontend-redirect-url: ${FRONTEND_URL:http://localhost:4200}
  backend-callback-url: ${BACKEND_CALLBACK_URL:http://localhost:8080/api/v1/auth/callback}
  
app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS}
    api-key: ${API_KEY}
    internal-api-key: ${APP_SECURITY_INTERNAL_API_KEY}
    x-api-key-enabled: true
    crypto-key: ${CRYPTO_KEY}  
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET}
    url: ${VNPAY_URL}
