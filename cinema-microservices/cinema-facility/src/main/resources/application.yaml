spring:
  application:
    name: cinema-facility
  jackson:
    time-zone: ${APP_TIMEZONE}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE}
        default_schema: facility
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    schemas: facility
    create-schemas: true
    baseline-on-migrate: true
    repair-on-migrate: true
  config:
    import: "optional:file:../../.env[.properties]"
  profiles:
    active: dev
logging:
  level:
    org.flywaydb: DEBUG
    springframework.boot.autoconfigure.flyway: DEBUG


management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
