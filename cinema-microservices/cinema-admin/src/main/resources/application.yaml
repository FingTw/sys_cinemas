spring:
  application:
    name: cinema-admin
  jackson:
    time-zone: ${APP_TIMEZONE}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE}
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false
  config:
    import: "optional:file:../.env[.properties]"
  profiles:
    active: dev
