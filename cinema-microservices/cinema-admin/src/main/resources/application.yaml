spring:
  application:
    name: cinema-admin
  jackson:
    time-zone: ${APP_TIMEZONE}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIMEZONE}
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false
  config:
    import: "optional:file:../../.env[.properties]"
  profiles:
    active: dev

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
